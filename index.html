<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia de Héroes Digitales - Portada</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #1e3a8a;
            background-image: 
                radial-gradient(#3b82f6 15%, transparent 16%),
                radial-gradient(#3b82f6 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
        }

        .comic-font {
            font-family: 'Bangers', cursive;
            letter-spacing: 2px;
        }

        .comic-panel {
            background-color: #ffffff;
            border: 6px solid #000;
            border-radius: 20px;
            box-shadow: 12px 12px 0px #000;
        }

        .btn-super {
            background: #ef4444;
            color: white;
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            transition: all 0.15s ease;
        }

        .btn-super:hover {
            transform: translate(-3px, -3px) scale(1.03);
            box-shadow: 10px 10px 0px #000;
            background: #dc2626;
        }

        .btn-super:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px #000;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .float-anim {
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Enlace envolvente que conduce a la pantalla interactiva -->
    <a href="juego.html" class="block max-w-lg w-full group transition-transform duration-200">
        <div class="comic-panel p-6 sm:p-8 bg-yellow-50 text-center flex flex-col items-center relative overflow-hidden group-hover:bg-yellow-100">
            
            <!-- Etiqueta superior -->
            <div class="inline-block bg-emerald-500 text-white font-black px-5 py-1.5 rounded-full border-4 border-black text-sm sm:text-base transform -rotate-2 mb-4 shadow-[4px_4px_0_#000]">
                <i class="fa-solid fa-leaf mr-2 text-yellow-300"></i> MISIÓN ESPECIAL CRIELE
            </div>

            <h1 class="text-4xl sm:text-5xl text-red-600 comic-font mb-4 drop-shadow-[2px_2px_0_#000]">
                ACADEMIA DE HÉROES DIGITALES
            </h1>

            <p class="text-sm sm:text-base font-black text-slate-700 mb-6 max-w-sm">
                ¡Haz clic para entrar a la aventura y descubrir el círculo de la convivencia!
            </p>

            <!-- Portada ilustrada del Señor CRIELE -->
            <div class="w-full rounded-2xl border-4 border-black overflow-hidden shadow-[8px_8px_0_#000] bg-emerald-100 float-anim mb-6 group-hover:scale-105 transition-transform duration-300">
                <img src="portada.png" alt="Señor CRIELE - Portada" class="w-full h-auto max-h-[420px] object-cover mx-auto block">
            </div>

            <!-- Botón de llamada a la acción -->
            <button class="btn-super comic-font text-2xl sm:text-3xl px-8 py-3.5 rounded-xl uppercase flex items-center gap-3">
                <i class="fa-solid fa-play"></i> PULSA PARA COMENZAR
            </button>
        </div>
    </a>

</body>
</html>
